name: Web build

# Builds the Godot web export on every push and pull request.
# Deploys to GitHub Pages only from main.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # raw art/audio sources are not needed to build

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL --retry 4 -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 4 -o /tmp/tpl.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$T"
          unzip -q -j /tmp/tpl.tpz 'templates/web_*' 'templates/version.txt' -d "$T"
          rm /tmp/tpl.tpz /tmp/godot.zip

      - name: Stamp build info
        run: |
          printf '{"commit": "%s"}\n' "${GITHUB_SHA::7}" > game/data/build.json

      - name: Import project
        # First run imports resources; a single export on a fresh checkout can miss them.
        run: ~/godot/godot --headless --path game --import

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path game --export-release "Web" ../build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.wasm
          test -f build/web/index.pck
          if grep -E "^(ERROR|SCRIPT ERROR)" export.log; then echo "Export logged errors"; exit 1; fi
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
