name: Web build

# Builds and tests the Godot web export on every push and pull request.
# The build is kept as a downloadable artifact (web-build) for local playtests.
# No GitHub Pages deploy: Pages on a private repo needs a paid plan (owner decision 2026-11-24).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false # raw art/audio sources are not needed to build

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot and web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          V="${GODOT_VERSION}-${GODOT_RELEASE}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          mkdir -p ~/godot
          curl -fsSL --retry 4 -o /tmp/godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}_linux.x86_64 ~/godot/godot
          curl -fsSL --retry 4 -o /tmp/tpl.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$T"
          unzip -q -j /tmp/tpl.tpz 'templates/web_*' 'templates/version.txt' -d "$T"
          rm /tmp/tpl.tpz /tmp/godot.zip

      - name: Stamp build info
        run: |
          printf '{"commit": "%s"}\n' "${GITHUB_SHA::7}" > game/data/build.json

      - name: Sync content into the game
        run: |
          python3 tools/sync_content.py
          git diff --exit-code game/data/dialogue_strings.csv game/data/dialogue_speakers.json || (echo "Run tools/sync_content.py and commit the result"; exit 1)

      - name: Import project
        # First run imports resources; a single export on a fresh checkout can miss them.
        run: ~/godot/godot --headless --path game --import

      - name: Movement reach test
        run: |
          ~/godot/godot --headless --fixed-fps 60 --path game res://tests/movement_test.tscn 2>&1 | tee movement.log
          grep -q "RESULT: PASS" movement.log

      - name: Stage bot playthroughs
        run: |
          set -euo pipefail
          for level in stage1 stage2; do
            ~/godot/godot --headless --fixed-fps 60 --path game res://tests/stage_playthrough.tscn -- --level=$level 2>&1 | tee $level.log
            grep -q "RESULT: PASS" $level.log
          done

      - name: Asset pipeline test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          pip install -q numpy pillow
          python3 tools/tests/test_pipeline.py

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path game --export-release "Web" ../build/web/index.html 2>&1 | tee export.log
          test -f build/web/index.wasm
          test -f build/web/index.pck
          if grep -E "^(ERROR|SCRIPT ERROR)" export.log; then echo "Export logged errors"; exit 1; fi

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 14
